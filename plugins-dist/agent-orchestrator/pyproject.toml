[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Durable Raven to agent-orchestrator CodeRun adapter plugin"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["raven", "raven-plugin", "agent-orchestrator", "coderun"]

# Deliberately no agent-orchestrator dependency: the adapter drives the AO CLI
# as a subprocess, and Raven supplies the tool contract.
dependencies = ["raven"]

# The one line that makes this package findable: plugin discovery reads this
# group, takes the value as a bare package name, and loads raven-plugin.toml
# out of that package.
[project.entry-points."raven.plugins"]
agent-orchestrator = "raven_ao"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_ao"]

# raven-plugin.toml is package data: discovery resolves it through
# importlib.resources inside the installed package, so a wheel that ships the
# modules without it installs a plugin nothing can find.
[tool.hatch.build]
include = ["raven_ao/**/*.py", "raven_ao/raven-plugin.toml"]

[tool.hatch.build.targets.sdist]
include = ["raven_ao/", "pyproject.toml"]

[tool.uv.sources]
raven = { workspace = true }
